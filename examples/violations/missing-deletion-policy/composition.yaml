apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: bucket-no-dp
spec:
  compositeTypeRef:
    apiVersion: nodp.example.org/v1alpha1
    kind: XBucketDp
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: bucket
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: Bucket
              spec:
                forProvider:
                  region: us-east-1
