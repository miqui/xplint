apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.8.2
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: bucket-missing-fn
spec:
  compositeTypeRef:
    apiVersion: nofunc.example.org/v1alpha1
    kind: XBucketFn
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-not-installed
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: bucket
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: Bucket
              spec:
                deletionPolicy: Orphan
                forProvider:
                  region: us-east-1
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.size
                toFieldPath: spec.forProvider.tags.size
              - fromFieldPath: metadata.labels[tier]
                toFieldPath: spec.forProvider.tags.tier
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: spec.tags.arn
