[package]
name = "xplint"
version = "0.1.0"
edition = "2021"
description = "Opinionated linter for Crossplane XRDs, Compositions and Functions"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
serde_json = "1"
thiserror = "2.0.21"
